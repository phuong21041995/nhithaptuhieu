name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm install --legacy-peer-deps

      - name: 4. Build Static Web App
        run: npm run build:apk-web

      - name: 5. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 6. Add and Sync Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 7. Grant execute permission for gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: 8. Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 9. Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nhi-Thap-Tu-Hieu-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
